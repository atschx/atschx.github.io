/* atschx.me - Direction E: Light and Dark
   Structure: huge Bodoni name, positioning line, three-entry fork
   Atmosphere from B: cool room, warm window from upper right
   Color system: indigo field, amber window, green anchor */

/* --- Base & Reset --- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
a { color: inherit; }
img { max-width: 100%; display: block; }

.dir-e {
  --font-serif: "Bodoni Moda", "Times New Roman", serif;
  --font-sans: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --font-mono: "IBM Plex Mono", "IBM Plex Sans", monospace;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  overflow-x: hidden;
  position: relative;
  font-family: var(--font-sans);
}

/* --- Light mode (default) --- */
.dir-e {
  --bg: #E6E8EF;
  --bg-deep: #DADEE8;
  --ink: #16110A;
  --mute: #554D42;
  --line: #2D2820;
  --anchor: #137738;
  --window: #FFEFDE;
  --window-core: #FFE7CD;
  --floor-cool: #D3D8E4;
  --floor-warm: #F4EDE4;
}

/* --- Dark mode --- */
@media (prefers-color-scheme: dark) {
  .dir-e {
    --bg: #0A0E19;
    --bg-deep: #05070F;
    --ink: #F2EADE;
    --mute: #A69D90;
    --line: #DDD7CD;
    --anchor: #3DBA64;
    --window: #EBBA84;
    --window-core: #E2B07A;
    --floor-cool: #18203A;
    --floor-warm: #1E1408;
  }
}

/* --- Atmosphere & Grain --- */
.dir-e .atmosphere,
.dir-e .grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.dir-e .atmosphere { z-index: 0; }

/* Light atmosphere: cool stone wall, pale gold daylight from upper right */
.dir-e .atmosphere {
  background:
    radial-gradient(ellipse 60% 70% at 97% 0%, rgba(255, 231, 205, 0.95), transparent 60%),
    radial-gradient(ellipse 52% 64% at 92% 60%, rgba(255, 239, 222, 0.78), transparent 72%),
    radial-gradient(ellipse 40% 36% at 82% 20%, rgba(255, 231, 205, 0.32), transparent 70%),
    radial-gradient(ellipse 70% 52% at 0% 100%, rgba(211, 216, 228, 0.95), transparent 62%),
    linear-gradient(156deg, #DADEE8 0%, #E6E8EF 50%, #F4EDE4 100%);
}

/* Dark atmosphere: indigo room, amber window light from upper right */
@media (prefers-color-scheme: dark) {
  .dir-e .atmosphere {
    background:
      radial-gradient(ellipse 58% 72% at 97% 0%, rgba(226, 176, 122, 0.58), transparent 58%),
      radial-gradient(ellipse 52% 68% at 93% 62%, rgba(226, 176, 122, 0.36), transparent 70%),
      radial-gradient(ellipse 42% 38% at 84% 20%, rgba(235, 186, 132, 0.16), transparent 72%),
      radial-gradient(ellipse 72% 55% at 0% 100%, rgba(24, 32, 58, 0.88), transparent 62%),
      radial-gradient(ellipse 48% 40% at 100% 100%, rgba(30, 20, 8, 0.70), transparent 58%),
      linear-gradient(156deg, #05070F 0%, #0A0E19 48%, #15120E 100%);
  }
}

.dir-e .grain {
  z-index: 1;
  /* Using CSS filter to simulate grain texture */
  background: 
    repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0px, transparent 1px, transparent 2px),
    repeating-linear-gradient(90deg, rgba(0,0,0,0.03) 0px, transparent 1px, transparent 2px);
  mix-blend-mode: overlay;
  opacity: 0.055;
  filter: contrast(140%) brightness(90%);
}

@media (prefers-color-scheme: dark) {
